        <style>
            body {
                font-family: "Noto Sans SC", system-ui, sans-serif;
                overflow-x: hidden;
                background: linear-gradient(to bottom, #fff5f7, #fff0f5, #fff8f0);
            }
            h1,
            h2 {
                font-family: "Noto Serif SC", Georgia, serif;
            }
            .fade-in {
                opacity: 0;
                transform: translateY(60px);
                transition: all 1.4s ease-out;
            }
            .fade-in.visible {
                opacity: 1;
                transform: translateY(0);
            }
            #music-toggle {
                position: fixed;
                bottom: 20px;
                left: 20px;
                z-index: 999;
            }

            @keyframes breathe {
                0%,
                100% {
                    transform: scale(1);
                    text-shadow: 0 0 10px rgba(244, 63, 94, 0.4);
                }
                50% {
                    transform: scale(1.1);
                    text-shadow: 0 0 25px rgba(244, 63, 94, 0.7);
                }
            }
            .breathe-glow {
                animation: breathe 8s ease-in-out infinite;
            }

            @keyframes heartbeat {
                0%,
                100% {
                    transform: scale(1);
                }
                50% {
                    transform: scale(1.12);
                }
            }
            .btn-heartbeat:hover {
                animation: heartbeat 1.5s infinite;
                box-shadow: 0 0 30px rgba(244, 63, 94, 0.6);
            }

            .letter-line {
                display: block;
                opacity: 0;
                transform: translateY(-50px);
                transition: all 1s ease-out;
                text-shadow:
                    0 0 18px rgba(255, 255, 255, 0.8),
                    0 0 30px rgba(244, 63, 94, 0.5);
                margin-bottom: 1.5em;
            }
            .letter-line.visible {
                opacity: 1;
                transform: translateY(0);
            }
            .letter-char {
                display: inline-block;
                opacity: 0;
                transform: translateY(-30px) scale(0.9);
                transition: all 0.5s ease-out;
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.7);
            }
            .letter-char.visible {
                opacity: 1;
                transform: translateY(0) scale(1);
            }

            /* 照片区域样式 */
            .photo-container {
                max-width: 800px;
                margin: 2rem auto;
                padding: 1rem;
                background: rgba(255, 255, 255, 0.4);
                border-radius: 16px;
                box-shadow: 0 8px 32px rgba(244, 63, 94, 0.1);
            }
            .photo-container svg {
                width: 100%;
                height: auto;
                border-radius: 12px;
            }
            /* 照片进入动画 - 不同方向 */
            .photo-container {
                opacity: 0;
                transform: translateY(60px) scale(0.92);
                transition: all 1.2s cubic-bezier(0.22, 1, 0.36, 1);
                will-change: transform, opacity;
            }

            .photo-container.visible-from-left {
                transform: translateX(-80px) scale(0.92);
            }
            .photo-container.visible-from-right {
                transform: translateX(80px) scale(0.92);
            }
            .photo-container.visible-from-top {
                transform: translateY(-100px) scale(0.9);
            }

            .photo-container.visible {
                opacity: 1;
                transform: translate(0, 0) scale(1);
            }

            /* 描述文字也延迟出现 */
            .photo-container p {
                opacity: 0;
                transform: translateY(20px);
                transition: all 0.9s ease-out 0.4s;
            }

            .photo-container.visible p {
                opacity: 1;
                transform: translateY(0);
            }

            /* hover 时轻微放大 + 浪漫光晕 */
            .photo-container img {
                transition: all 0.6s ease;
                box-shadow: 0 4px 20px rgba(244, 63, 94, 0.15);
                border: 1px solid rgba(255, 255, 255, 0.4);
            }

            .photo-container:hover img {
                transform: scale(1.04);
                box-shadow: 0 12px 40px rgba(244, 63, 94, 0.35);
            }

            /* 给时间线标题加一点呼吸感 */
            .time-title {
                animation: soft-breathe 10s ease-in-out infinite;
            }

            @keyframes soft-breathe {
                0%,
                100% {
                    text-shadow: 0 0 10px rgba(244, 63, 94, 0.3);
                }
                50% {
                    text-shadow: 0 0 24px rgba(244, 63, 94, 0.6);
                }
            }
        </style>
    </head>

            <!-- 时间线 + 照片区（新增你的家庭照片示例） -->

        <script>
            // 音乐控制（不变）
            const audio = document.getElementById("bgm");
            const toggleBtn = document.getElementById("music-toggle");
            const musicText = document.getElementById("music-text");
            let isPlaying = false;

            toggleBtn.addEventListener("click", () => {
                if (isPlaying) {
                    audio.pause();
                    musicText.textContent = "播放音乐";
                } else {
                    audio.play().catch(() => {});
                    musicText.textContent = "暂停音乐";
                }
                isPlaying = !isPlaying;
            });

            // 进入主页面（不变）
            document.getElementById("enter-btn").addEventListener("click", () => {
                document.getElementById("cover").classList.add("hidden");
                document.getElementById("main").classList.remove("hidden");
                audio.play().catch(() => {});
                isPlaying = true;
                musicText.textContent = "暂停音乐";
                launchFirework(true);
                setTimeout(() => launchHeartRain(30), 800);
            });

            // 淡入观察器（不变）
            const observer = new IntersectionObserver(
                (entries) => {
                    entries.forEach((entry) => {
                        if (entry.isIntersecting) entry.target.classList.add("visible");
                    });
                },
                { threshold: 0.15 },
            );
            document.querySelectorAll(".fade-in").forEach((el) => observer.observe(el));

            // ────────────────────────────────────────────────
            // 烟花 Canvas ─ 五颜六色 + 心形绽放变体
            // ────────────────────────────────────────────────
            const fwCanvas = document.getElementById("fireworks");
            const ctx = fwCanvas.getContext("2d");
            fwCanvas.width = window.innerWidth;
            fwCanvas.height = window.innerHeight;
            window.addEventListener("resize", () => {
                fwCanvas.width = window.innerWidth;
                fwCanvas.height = window.innerHeight;
            });

            let fireworks = [];

            const COLOR_POOL = [
                "#ff6b6b",
                "#ff8e53",
                "#ffcc5c",
                "#a8e063",
                "#4facfe",
                "#a166ff",
                "#ff9a9e",
                "#fad0c4",
                "#fec89a",
                "#d4fc79",
                "#96e6a1",
                "#a8edea",
                "#ffc3a0",
                "#ffafbd",
                "#f093fb",
                "#6dd5ed",
                "#89fffd",
            ];

            class Firework {
                constructor(x = null, y = null, isHeartBloom = false) {
                    this.x = x ?? Math.random() * fwCanvas.width;
                    this.y = y ?? fwCanvas.height + 50;
                    this.particles = [];
                    this.exploded = false;
                    this.color = COLOR_POOL[Math.floor(Math.random() * COLOR_POOL.length)];
                    this.isHeartBloom = isHeartBloom; // 是否心形绽放模式
                    this.vy = -Math.random() * 15 - 14;
                    this.explodeY = Math.random() * (fwCanvas.height * 0.45) + 100;
                }

                update() {
                    if (!this.exploded) {
                        this.y += this.vy;
                        this.vy += 0.18;
                        if (this.y <= this.explodeY) this.explode();
                    } else {
                        this.particles.forEach((p) => p.update());
                        this.particles = this.particles.filter((p) => p.alpha > 0);
                    }
                }

                explode() {
                    this.exploded = true;
                    const count = this.isHeartBloom ? 120 : 80;
                    for (let i = 0; i < count; i++) {
                        let angle;
                        if (this.isHeartBloom) {
                            // 心形绽放：角度分布更集中，形成心形轮廓
                            const t = (i / count) * Math.PI * 2;
                            angle = t + Math.sin(t * 3) * 0.4; // 心形扰动
                        } else {
                            angle = (i / count) * Math.PI * 2 + (Math.random() - 0.5) * 0.3;
                        }
                        const speed = Math.random() * 7 + 3.5;
                        const shape = this.isHeartBloom || Math.random() < 0.5 ? "heart" : "circle";
                        this.particles.push(
                            new Particle(this.x, this.y, angle, speed, this.color, shape),
                        );
                    }
                }

                draw() {
                    if (!this.exploded) {
                        ctx.fillStyle = "rgba(255,255,255,0.95)";
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 6, 0, Math.PI * 2);
                        ctx.fill();
                    } else {
                        this.particles.forEach((p) => p.draw());
                    }
                }
            }

            class Particle {
                constructor(x, y, angle, speed, color, shape) {
                    this.x = x;
                    this.y = y;
                    this.vx = Math.cos(angle) * speed;
                    this.vy = Math.sin(angle) * speed;
                    this.color = color;
                    this.alpha = 1;
                    this.shape = shape;
                    this.gravity = 0.11;
                    this.friction = 0.98;
                }

                update() {
                    this.vy += this.gravity;
                    this.vx *= this.friction;
                    this.vy *= this.friction;
                    this.x += this.vx;
                    this.y += this.vy;
                    this.alpha -= 0.009;
                }

                draw() {
                    ctx.save();
                    ctx.globalAlpha = this.alpha;
                    ctx.fillStyle = this.color;
                    if (this.shape === "heart") {
                        const s = 11;
                        ctx.translate(this.x, this.y);
                        ctx.scale(0.9 + this.alpha * 0.3, 0.9 + this.alpha * 0.3);
                        ctx.beginPath();
                        ctx.moveTo(0, s * 0.25);
                        ctx.bezierCurveTo(-s * 0.75, -s * 0.65, -s * 1.15, -s * 0.45, -s * 0.95, 0);
                        ctx.bezierCurveTo(-s * 0.85, s * 0.55, 0, s * 1.15, 0, s * 0.95);
                        ctx.bezierCurveTo(0, s * 1.15, s * 0.85, s * 0.55, s * 0.95, 0);
                        ctx.bezierCurveTo(s * 1.15, -s * 0.45, s * 0.75, -s * 0.65, 0, s * 0.25);
                        ctx.closePath();
                        ctx.fill();
                    } else {
                        ctx.beginPath();
                        ctx.arc(this.x, this.y, 5 * this.alpha + 1, 0, Math.PI * 2);
                        ctx.fill();
                    }
                    ctx.restore();
                }
            }

            function animateFireworks() {
                ctx.fillStyle = "rgba(0,0,0,0.06)";
                ctx.fillRect(0, 0, fwCanvas.width, fwCanvas.height);
                fireworks.forEach((fw, i) => {
                    fw.update();
                    fw.draw();
                    if (fw.exploded && fw.particles.length === 0) fireworks.splice(i, 1);
                });
                requestAnimationFrame(animateFireworks);
            }
            animateFireworks();

            function launchFirework(isHeartBloom = false) {
                fireworks.push(new Firework(null, null, isHeartBloom));
            }

            setInterval(() => {
                launchFirework(Math.random() < 0.5); // 50% 概率心形绽放
            }, 3500);

            fwCanvas.addEventListener("click", (e) => launchFirework(true));

            // ────────────────────────────────────────────────
            // 爱心飘落 ─ 粉白色、更圆润、数量减少
            // ────────────────────────────────────────────────
            const heartCanvas = document.getElementById("hearts");
            const hCtx = heartCanvas.getContext("2d");
            heartCanvas.width = window.innerWidth;
            heartCanvas.height = window.innerHeight;
            window.addEventListener("resize", () => {
                heartCanvas.width = window.innerWidth;
                heartCanvas.height = window.innerHeight;
            });

            const hearts = [];

            function createHeart() {
                return {
                    x: Math.random() * heartCanvas.width,
                    y: Math.random() * heartCanvas.height - heartCanvas.height,
                    size: Math.random() * 18 + 16, // 更大更饱满
                    speed: Math.random() * 1.2 + 0.6,
                    sway: Math.random() * 2 + 1,
                    angle: Math.random() * Math.PI * 2,
                    rotSpeed: (Math.random() - 0.5) * 0.03,
                    opacity: Math.random() * 0.4 + 0.5,
                };
            }

            for (let i = 0; i < 40; i++) {
                // 数量减少到40
                hearts.push(createHeart());
            }

            function drawHearts() {
                hCtx.clearRect(0, 0, heartCanvas.width, heartCanvas.height);
                hearts.forEach((h) => {
                    h.y += h.speed;
                    h.x += Math.sin(h.angle) * h.sway;
                    h.angle += h.rotSpeed;

                    if (h.y > heartCanvas.height + 100) {
                        Object.assign(h, createHeart());
                        h.y = -100;
                    }

                    hCtx.save();
                    hCtx.globalAlpha = h.opacity;
                    hCtx.fillStyle = "#fff0f5"; // 粉白色基调
                    hCtx.strokeStyle = "#ffebee";
                    hCtx.lineWidth = 1.5;
                    hCtx.translate(h.x, h.y);
                    hCtx.rotate(h.angle);
                    hCtx.scale(h.size / 40, h.size / 40);

                    hCtx.beginPath();
                    hCtx.moveTo(0, 15);
                    hCtx.bezierCurveTo(-18, -18, -32, -18, -32, 4);
                    hCtx.bezierCurveTo(-32, 28, 0, 48, 0, 48);
                    hCtx.bezierCurveTo(0, 48, 32, 28, 32, 4);
                    hCtx.bezierCurveTo(32, -18, 18, -18, 0, 15);
                    hCtx.closePath();
                    hCtx.fill();
                    hCtx.stroke(); // 加细边框，更立体圆润

                    hCtx.restore();
                });
                requestAnimationFrame(drawHearts);
            }
            drawHearts();

            // 信件洒落效果（保持不变）
            const letterEl = document.getElementById("letter");
            const fullText = `亲爱的翠姣，

今天是我们结婚三周年的日子，我坐在这里，想对你说很多很多。

你知道吗？三年前的那个周末我们刚确定关系不久，你爸妈还经常吵架，看到你在工位上哭泣的说出身世时，我拥抱着你，那一刻我就已经认定你就是我的人，一生要守护的人。很快，就来到三年前的今天，你穿着婚纱对我微笑，我在你爸妈面前说：这辈子都要好好爱你、护着你。可真正走过来才发现，能被你爱着，是我这辈子最大的幸运。

谢谢你愿意嫁给我，谢谢你给这个家庭带来的每一份付出，谢谢你包容我的不成熟，一次次吵架过后都会笑着说是你给我台阶，谢谢你在每一个深夜陪我聊天，在我疲惫的时候给我一个拥抱。你生哥哥和妹妹的时候，我看着你在产房里那么努力、那么勇敢，想想我眼泪都快流下来了。你说不疼，可我知道你承受了多少。

你从一个爱撒娇、不成熟的小女孩，变成了两个孩子的妈妈，却从来没有抱怨过一句。你包容我的小脾气，理解我的压力，还总是笑着说“我们虽然没有房子，但是我们已经很幸福了”。翠姣，你知道吗？你每一次的笑，每一次的温柔，都在治愈我。

这三年，我们吵过架，也一起哭过，但更多的是牵着手看孩子们一天天长大，看彼此越来越像一家人。我常常想，如果人生可以重来，我还是会毫不犹豫地选择你。

未来的日子还很长，我会继续努力，给你和孩子们更好的生活。我想和你一起，看哥哥妹妹上学、毕业、结婚；想和你一起慢慢变老，手牵手去看夕阳。

黎翠姣，我爱你。
比三年前更爱，比明天更爱，直到永远。

2026年农历二月二十四`; //

            const lines = fullText.split("\n").filter((l) => l.trim());

            let lineIndex = 0;
            let charIndex = 0;
            let currentLineEl = null;

            function typeNextChar() {
                if (lineIndex >= lines.length) return;

                if (charIndex === 0) {
                    currentLineEl = document.createElement("div");
                    currentLineEl.className = "letter-line";
                    letterEl.appendChild(currentLineEl);
                    setTimeout(() => currentLineEl.classList.add("visible"), 120);
                }

                const line = lines[lineIndex];
                if (charIndex < line.length) {
                    const span = document.createElement("span");
                    span.className = "letter-char";
                    span.textContent = line[charIndex] === " " ? "\u00A0" : line[charIndex];
                    currentLineEl.appendChild(span);
                    setTimeout(() => span.classList.add("visible"), 30);
                    charIndex++;
                    setTimeout(typeNextChar, 65 + Math.random() * 45);
                } else {
                    charIndex = 0;
                    lineIndex++;
                    const pause = line.trim().match(/[。！？]$/) ? 1400 : 900;
                    setTimeout(typeNextChar, pause);
                    window.scrollBy({ top: 50, behavior: "smooth" });
                }
            }

            const letterObserver = new IntersectionObserver(
                (entries) => {
                    if (entries[0].isIntersecting && letterEl.children.length === 0) {
                        typeNextChar();
                        letterObserver.disconnect();
                    }
                },
                { threshold: 0.1 },
            );

            letterObserver.observe(letterEl);
        </script>
